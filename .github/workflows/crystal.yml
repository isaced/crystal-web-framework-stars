name: Auto Update CI

on:
  schedule:
    - cron: "0 0 * * SUN"
  push:
    branches:
      - master
    paths:
      - 'list.txt'
      - 'list2md.cr'
      - 'README.ecr'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal:1.22.3-alpine

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Crystal Script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: crystal list2md.cr

    - name: Commit & Push
      env:
        USER: github-actions[bot]
        EMAIL: github-actions[bot]@users.noreply.github.com
      run: |
        git config --global --add safe.directory /__w/crystal-web-framework-stars/crystal-web-framework-stars
        git status
        git remote -v
        git config user.email $EMAIL
        git config user.name $USER
        git checkout master
        git add README.md list.json
        git commit -m "Auto update"
        git push
